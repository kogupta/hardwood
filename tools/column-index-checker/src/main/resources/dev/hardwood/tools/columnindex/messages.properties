subscript.space=index of the wrong column-index space for %3$s.%nfound   : %1$s%nrequired: %2$s
indexedby.handover=%3$s is indexed by another column-index space than the value handed to it.%nfound   : %1$s%nrequired: %2$s
indexedby.element=an element of %3$s has no @IndexedBy, so a container handed to it loses its column-index space.%nfound   : %1$s%nrequired: %2$s
indexedby.invalid=@IndexedBy names %s, which is not a column-index space
class.unchecked=the column-index checker skips the bodies of local and anonymous classes; move this code into a method or a member class
